plugins {
    id "com.android.application"
}

android {
    namespace "tr.edu.erdogan.secureclick"
    compileSdk 35

    defaultConfig {
        applicationId "tr.edu.erdogan.secureclick"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        // Emülatörden bilgisayardaki sunucuya erişim adresi; Ayarlar ekranından değiştirilebilir.
        buildConfigField "String", "DEFAULT_SERVER", "\"http://10.0.2.2:8000\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"  // Android'in org.json'u yerel testlerde çalışmaz
}
